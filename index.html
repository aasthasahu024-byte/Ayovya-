<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="theme-color" content="#0F0F0F"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Ayovya"/>
<meta name="description" content="Ayovya Daily Operations Checklist"/>
<title>Ayovya</title>

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Cinzel:wght@400;500;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet"/>

<style>
:root {
  --gold: #C9A84C;
  --gold-dim: #8A6E2E;
  --gold-glow: rgba(201,168,76,0.08);
  --dark: #0C0B09;
  --surface: #131109;
  --card: #1A1810;
  --border: #252118;
  --text: #C8BFA0;
  --text-muted: #6A6048;
  --text-faint: #3A3428;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

html,body{
  background:var(--dark);
  color:var(--text);
  font-family:'EB Garamond',Georgia,serif;
  min-height:100vh;
  overscroll-behavior:none;
}

::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:var(--dark)}
::-webkit-scrollbar-thumb{background:#2A2218;border-radius:2px}

.cinzel{font-family:'Cinzel',serif}
.cormorant{font-family:'Cormorant Garamond',serif}

/* ── HEADER ── */
#header{
  position:sticky;top:0;z-index:100;
  background:var(--dark);
  border-bottom:1px solid var(--border);
  padding:20px 18px 0;
}
#header-top{display:flex;align-items:baseline;gap:10px;margin-bottom:3px}
#logo{font-family:'Cinzel',serif;font-size:22px;color:var(--gold);letter-spacing:.14em;font-weight:500}
#tagline{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:13px;color:var(--text-faint);letter-spacing:.03em}
#subtitle{font-family:'Cinzel',serif;font-size:9px;color:var(--text-faint);letter-spacing:.12em;text-transform:uppercase;margin-bottom:14px}

/* ── TABS ── */
#tabs{display:flex;gap:28px;border-top:1px solid var(--border)}
.tab{
  background:none;border:none;border-bottom:1.5px solid transparent;
  padding:9px 0;cursor:pointer;
  font-family:'Cinzel',serif;font-size:9.5px;
  letter-spacing:.1em;color:var(--text-faint);
  text-transform:uppercase;transition:all .2s;
}
.tab.active{color:var(--gold);border-bottom-color:var(--gold)}
.tab:hover{color:#9A8A68}

/* ── DATE BAR ── */
#datebar{
  display:flex;align-items:center;gap:8px;
  padding:12px 16px;
  border-bottom:1px solid var(--border);
  background:var(--dark);
}
.nav-btn{
  background:none;border:1px solid var(--border);color:var(--text-faint);
  width:32px;height:32px;border-radius:2px;cursor:pointer;
  font-size:14px;display:flex;align-items:center;justify-content:center;
  transition:all .2s;flex-shrink:0;
}
.nav-btn:hover{border-color:var(--gold);color:var(--gold)}
.nav-btn:disabled{opacity:.2;cursor:default}
#date-label{flex:1;text-align:center}
#date-main{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:15px;color:#9A8A68}
#date-main.today{color:var(--gold)}

/* ── PROGRESS ── */
#progressbar{
  padding:10px 16px;
  display:flex;align-items:center;gap:12px;
  border-bottom:1px solid var(--border);
}
#progress-track{flex:1;height:2px;background:#1A1810;border-radius:1px;overflow:hidden}
#progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),#E8D5A3);border-radius:1px;transition:width .4s ease;width:0%}
#progress-label{font-family:'Cinzel',serif;font-size:11px;color:var(--text-faint);letter-spacing:.05em;white-space:nowrap}

/* ── SECTION ── */
.section{border-bottom:1px solid var(--border)}
.section-head{
  display:flex;align-items:center;gap:10px;
  padding:9px 16px 7px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
}
.section-roman{font-family:'Cinzel',serif;font-size:9px;color:var(--gold);opacity:.6;letter-spacing:.1em}
.section-label{font-family:'Cinzel',serif;font-size:9.5px;color:var(--text-faint);letter-spacing:.08em;text-transform:uppercase;flex:1}
.section-count{font-family:'EB Garamond',serif;font-size:12px;color:var(--text-faint)}

/* ── TASK ROW ── */
.task-row{
  display:grid;
  grid-template-columns:32px 1fr 32px;
  gap:8px;align-items:start;
  padding:10px 14px;
  border-bottom:1px solid var(--border);
  transition:background .15s;
}
.task-row:last-of-type{border-bottom:none}
.task-row:hover{background:var(--gold-glow)}

.check-box{
  width:20px;height:20px;
  border:1.5px solid var(--border);border-radius:2px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;margin-top:2px;
  transition:all .2s;
}
.check-box:hover{border-color:var(--gold)}
.check-box.done{background:var(--gold);border-color:var(--gold)}
.check-box.done::after{content:'✓';font-size:11px;font-weight:bold;color:#0C0B09}

.task-body{display:flex;flex-wrap:wrap;align-items:center;gap:6px;cursor:pointer}
.task-text{font-family:'EB Garamond',serif;font-size:15px;line-height:1.5;color:var(--text);transition:color .2s}
.task-text.done{color:var(--text-faint);text-decoration:line-through;text-decoration-color:var(--border)}

.stage-tag{
  font-family:'Cinzel',serif;font-size:8.5px;letter-spacing:.06em;
  color:#7A6A40;background:rgba(201,168,76,.07);
  border:1px solid #302A18;padding:2px 7px;border-radius:10px;white-space:nowrap;
}

.note-btn{
  width:28px;height:28px;border-radius:50%;
  border:1px solid var(--border);background:none;
  cursor:pointer;color:var(--text-faint);font-size:13px;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;margin-top:0;
}
.note-btn:hover,.note-btn.has-note{border-color:var(--gold);color:var(--gold)}

/* note area */
.note-area{
  grid-column:1/-1;
  margin-top:4px;
  background:rgba(201,168,76,.04);
  border:1px solid var(--border);border-radius:3px;
  overflow:hidden;
  max-height:0;transition:max-height .3s ease;
}
.note-area.open{max-height:120px}
.note-area textarea{
  width:100%;min-height:56px;
  background:none;border:none;outline:none;resize:none;
  color:#9A8A68;font-family:'EB Garamond',serif;font-size:14px;
  line-height:1.5;padding:8px 10px;
}
.note-area textarea::placeholder{color:var(--text-faint);font-style:italic}

/* ── COMPLETION ── */
#completion{display:none;text-align:center;padding:24px 16px}
#completion.show{display:block}
.ornament{color:var(--gold);opacity:.35;font-size:11px;letter-spacing:5px}
#completion p{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:17px;color:var(--gold);margin-top:8px}

/* ── HISTORY ── */
#history-panel{display:none}
#history-panel.show{display:block}
#history-head{padding:14px 18px 10px;border-bottom:1px solid var(--border)}
#history-head p{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:15px;color:var(--text-faint)}
.hist-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:13px 16px;border-bottom:1px solid var(--border);
  cursor:pointer;transition:background .15s;
}
.hist-row:hover{background:var(--gold-glow)}
.hist-date{font-family:'Cormorant Garamond',serif;font-size:15px;color:#9A8A68}
.hist-date.today-hist{color:var(--gold)}
.hist-sub{font-family:'EB Garamond',serif;font-size:12px;color:var(--text-faint);margin-top:2px}
.hist-pct{font-family:'Cinzel',serif;font-size:12px;color:var(--text-faint);margin-right:6px}
.hist-pct.full{color:var(--gold)}
.hist-arr{color:var(--border);font-size:13px}
.hist-empty{padding:40px 20px;text-align:center;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:15px;color:var(--text-faint)}

/* ── FOOTER ── */
#footer{padding:20px 16px 8px;text-align:center}
#footer .orn{color:var(--gold);opacity:.2;font-size:9px;letter-spacing:5px}
#footer .copy{font-family:'Cinzel',serif;font-size:7.5px;color:var(--text-faint);letter-spacing:.15em;margin-top:7px}

/* ── DAILY PANEL ── */
#daily-panel{}

/* fade in */
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.fade{animation:fadeUp .25s ease}
</style>
</head>

<body>

<!-- HEADER -->
<div id="header">
  <div id="header-top">
    <span id="logo">AYOVYA</span>
    <span id="tagline">Pure. Fresh. Verified.</span>
  </div>
  <div id="subtitle">Daily Operations</div>
  <div id="tabs">
    <button class="tab active" onclick="switchTab('daily')" id="tab-daily">Today's Record</button>
    <button class="tab" onclick="switchTab('history')" id="tab-history">History</button>
  </div>
</div>

<!-- DAILY PANEL -->
<div id="daily-panel">

  <!-- Date Bar -->
  <div id="datebar">
    <button class="nav-btn" onclick="navDate(-1)">&#8592;</button>
    <div id="date-label">
      <div id="date-main"></div>
    </div>
    <button class="nav-btn" id="btn-next" onclick="navDate(1)">&#8594;</button>
  </div>

  <!-- Progress -->
  <div id="progressbar">
    <div id="progress-track"><div id="progress-fill"></div></div>
    <span id="progress-label">0 / 21</span>
  </div>

  <!-- Tasks -->
  <div id="tasks-container"></div>

  <!-- Completion -->
  <div id="completion">
    <div class="ornament">✦ &nbsp; ✦ &nbsp; ✦</div>
    <p>All tasks completed with distinction.</p>
  </div>

  <div id="footer">
    <div class="orn">· · · · ·</div>
    <div class="copy">AYOVYA &copy; 2026</div>
  </div>
</div>

<!-- HISTORY PANEL -->
<div id="history-panel">
  <div id="history-head"><p>Completed Records</p></div>
  <div id="history-list"></div>
</div>

<script>
// ── DATA ──────────────────────────────────────────────
const SECTIONS = [
  { id:'crop', roman:'I', label:'Crop & Tray Cycle', tasks:[
    {id:'c1', text:'Inspect all trays — colour, height, uniformity'},
    {id:'c2', text:'Check for mould, pests, odd smell'},
    {id:'c3', text:'Water trays — correct amount per stage'},
    {id:'c4', text:'Move trays from blackout to light (day 3–4)'},
    {id:'c5', text:'Check germination on new trays'},
    {id:'c6', text:'Harvest ready tray — weigh & log'},
  ]},
  { id:'batch', roman:'II', label:'New Batch', tasks:[
    {id:'b1', text:'Soak seeds for next batch'},
    {id:'b2', text:'Prepare coco peat — moisten, check texture'},
    {id:'b3', text:'Fill tray, sow seeds, label'},
    {id:'b4', text:'Place in blackout zone'},
  ]},
  { id:'coco', roman:'III', label:'Coco Peat Processing', tasks:[
    {id:'p1', text:'Rinse with warm water, dry before reuse', stage:'2nd Use'},
    {id:'p2', text:'Sterilise — warm water + organic dry material', stage:'3rd Use'},
    {id:'p3', text:'Discard after 3rd cycle', stage:'End'},
  ]},
  { id:'clean', roman:'IV', label:'Cleaning & Hygiene', tasks:[
    {id:'h1', text:'Wash & dry harvested trays'},
    {id:'h2', text:'Wipe shelves & growing surface'},
    {id:'h3', text:'Clean copper vessel'},
    {id:'h4', text:'Gloves on before handling'},
  ]},
  { id:'weekly', roman:'V', label:'Weekly Tasks', tasks:[
    {id:'w1', text:'Refill seed jars — check stock'},
    {id:'w2', text:'Batch wash all spare trays'},
    {id:'w3', text:'Check coco peat stock'},
    {id:'w4', text:'Review week\'s yield log'},
  ]},
];

const ALL_TASKS = SECTIONS.flatMap(s => s.tasks);
const TOTAL = ALL_TASKS.length;

// ── STATE ─────────────────────────────────────────────
let activeDate = todayStr();
let records = {};       // { "2026-05-08": { c1:{done,note}, ... } }
let openNotes = {};     // { taskId: bool }
let currentTab = 'daily';

function todayStr(){
  return new Date().toISOString().split('T')[0];
}

function fmtLong(d){
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}

function fmtShort(d){
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
}

// ── STORAGE ───────────────────────────────────────────
function load(){
  try{ records = JSON.parse(localStorage.getItem('ayovya-records')||'{}'); }catch{}
}
function save(){
  try{ localStorage.setItem('ayovya-records', JSON.stringify(records)); }catch{}
}

// ── RENDER ────────────────────────────────────────────
function getDay(date){ return records[date] || {}; }

function renderDaily(){
  const day = getDay(activeDate);
  const today = todayStr();

  // date
  const dm = document.getElementById('date-main');
  dm.textContent = fmtLong(activeDate);
  dm.className = activeDate === today ? 'today' : '';
  document.getElementById('btn-next').disabled = activeDate >= today;

  // progress
  const done = ALL_TASKS.filter(t => day[t.id]?.done).length;
  const pct = Math.round((done/TOTAL)*100);
  document.getElementById('progress-fill').style.width = pct+'%';
  document.getElementById('progress-label').textContent = done+' / '+TOTAL;

  // tasks
  const container = document.getElementById('tasks-container');
  container.innerHTML = '';

  SECTIONS.forEach(section => {
    const secDone = section.tasks.filter(t => day[t.id]?.done).length;

    const secDiv = document.createElement('div');
    secDiv.className = 'section fade';

    // section header
    secDiv.innerHTML = `<div class="section-head">
      <span class="section-roman cinzel">${section.roman}</span>
      <span class="section-label cinzel">${section.label}</span>
      <span class="section-count">${secDone}/${section.tasks.length}</span>
    </div>`;

    section.tasks.forEach(task => {
      const td = day[task.id] || {};
      const isDone = !!td.done;
      const noteVal = td.note || '';
      const noteOpen = !!openNotes[task.id];

      const row = document.createElement('div');
      row.className = 'task-row';
      row.innerHTML = `
        <div class="check-box${isDone?' done':''}" onclick="toggleTask('${task.id}')"></div>
        <div class="task-body" onclick="toggleTask('${task.id}')">
          <span class="task-text${isDone?' done':''}">${task.text}</span>
          ${task.stage ? `<span class="stage-tag">${task.stage}</span>` : ''}
        </div>
        <button class="note-btn${noteVal?' has-note':''}" onclick="toggleNote('${task.id}')" title="Note">✎</button>
        <div class="note-area${noteOpen||noteVal?' open':''}" id="note-${task.id}">
          <textarea placeholder="Add observation…" oninput="setNote('${task.id}',this.value)">${noteVal}</textarea>
        </div>`;
      secDiv.appendChild(row);
    });

    container.appendChild(secDiv);
  });

  // completion message
  const comp = document.getElementById('completion');
  comp.className = done === TOTAL ? 'show' : '';
}

function renderHistory(){
  const list = document.getElementById('history-list');
  const today = todayStr();
  const dates = Object.keys(records).sort().reverse();

  if(dates.length === 0){
    list.innerHTML = '<div class="hist-empty">No records yet. Begin today.</div>';
    return;
  }

  list.innerHTML = '';
  dates.forEach(date => {
    const day = records[date] || {};
    const done = ALL_TASKS.filter(t => day[t.id]?.done).length;
    const pct = Math.round((done/TOTAL)*100);
    const row = document.createElement('div');
    row.className = 'hist-row';
    row.innerHTML = `
      <div>
        <div class="hist-date${date===today?' today-hist':''}">${fmtLong(date)}</div>
        <div class="hist-sub">${done} of ${TOTAL} tasks completed</div>
      </div>
      <div style="display:flex;align-items:center">
        <span class="hist-pct${pct===100?' full':''}">${pct}%</span>
        <span class="hist-arr">›</span>
      </div>`;
    row.onclick = () => { activeDate = date; switchTab('daily'); };
    list.appendChild(row);
  });
}

// ── ACTIONS ───────────────────────────────────────────
function toggleTask(id){
  if(!records[activeDate]) records[activeDate] = {};
  const cur = records[activeDate][id] || {};
  records[activeDate][id] = {...cur, done: !cur.done};
  save();
  renderDaily();
}

function setNote(id, val){
  if(!records[activeDate]) records[activeDate] = {};
  const cur = records[activeDate][id] || {};
  records[activeDate][id] = {...cur, note: val};
  save();
  // update note button style only
  const btn = document.querySelector(`[onclick="toggleNote('${id}')"]`);
  if(btn) btn.className = 'note-btn' + (val ? ' has-note' : '');
}

function toggleNote(id){
  openNotes[id] = !openNotes[id];
  const area = document.getElementById('note-'+id);
  if(area){
    if(openNotes[id]){
      area.classList.add('open');
      area.querySelector('textarea').focus();
    } else {
      area.classList.remove('open');
    }
  }
  const btn = document.querySelector(`[onclick="toggleNote('${id}')"]`);
  if(btn){
    const day = getDay(activeDate);
    const hasNote = !!(day[id]?.note);
    btn.className = 'note-btn' + ((openNotes[id]||hasNote) ? ' has-note' : '');
  }
}

function navDate(dir){
  const d = new Date(activeDate + 'T00:00:00');
  d.setDate(d.getDate() + dir);
  const nd = d.toISOString().split('T')[0];
  if(nd <= todayStr()){ activeDate = nd; openNotes = {}; renderDaily(); }
}

function switchTab(tab){
  currentTab = tab;
  document.getElementById('tab-daily').className = 'tab' + (tab==='daily'?' active':'');
  document.getElementById('tab-history').className = 'tab' + (tab==='history'?' active':'');
  document.getElementById('daily-panel').style.display = tab==='daily' ? 'block' : 'none';
  document.getElementById('history-panel').className = tab==='history' ? 'show' : '';
  if(tab==='history') renderHistory();
  if(tab==='daily') renderDaily();
}

// ── PWA SERVICE WORKER ────────────────────────────────
const SW_CODE = `
const CACHE = 'ayovya-v1';
self.addEventListener('install', e => {
  e.waitUntil(caches.open(CACHE).then(c => c.addAll(['/'])));
  self.skipWaiting();
});
self.addEventListener('activate', e => {
  e.waitUntil(caches.keys().then(keys =>
    Promise.all(keys.filter(k => k!==CACHE).map(k => caches.delete(k)))
  ));
  self.clients.claim();
});
self.addEventListener('fetch', e => {
  e.respondWith(caches.match(e.request).then(r => r || fetch(e.request).catch(() => caches.match('/'))))
});`;

if('serviceWorker' in navigator){
  const blob = new Blob([SW_CODE], {type:'application/javascript'});
  const url = URL.createObjectURL(blob);
  navigator.serviceWorker.register(url).catch(()=>{});
}

// ── MANIFEST ─────────────────────────────────────────
const manifest = {
  name:'Ayovya Operations',
  short_name:'Ayovya',
  start_url:'/',
  display:'standalone',
  background_color:'#0C0B09',
  theme_color:'#0C0B09',
  icons:[
    {src:`data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230C0B09'/><text y='70' x='50' text-anchor='middle' font-size='60' fill='%23C9A84C' font-family='serif'>A</text></svg>`,sizes:'192x192',type:'image/svg+xml'},
  ]
};
const mBlob = new Blob([JSON.stringify(manifest)],{type:'application/json'});
const mUrl = URL.createObjectURL(mBlob);
const mLink = document.createElement('link');
mLink.rel='manifest'; mLink.href=mUrl;
document.head.appendChild(mLink);

// ── INIT ─────────────────────────────────────────────
load();
renderDaily();
</script>
</body>
</html>
